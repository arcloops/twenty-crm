# Arcloops small-team stack (8–10 users): one Node process (API + queues),
# Postgres, Redis. Do NOT also run a separate worker service.
#
# RUN_WORKERS_IN_SERVER lives in this repo's app.module — build from source.
# Upstream twentycrm/twenty images ignore the flag.
#
# Usage (from repo root):
#   cp packages/twenty-docker/arcloops.env.example packages/twenty-docker/.env
#   # fill secrets / Google OAuth / S3
#   docker compose -f packages/twenty-docker/docker-compose.arcloops.yml --env-file packages/twenty-docker/.env up -d --build
#
# Railway: point the server service Dockerfile at
#   packages/twenty-docker/twenty/Dockerfile
# with root as build context; set RUN_WORKERS_IN_SERVER=true; remove worker.

name: arcloops-crm

services:
  server:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
    image: arcloops-crm/twenty:${TAG:-local}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      NODE_PORT: 3000
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      RUN_WORKERS_IN_SERVER: "true"
      # Exclude unused high-concurrency queues on a tiny single process
      WORKER_EXCLUDED_QUEUES: ${WORKER_EXCLUDED_QUEUES:-ai-queue,ai-stream-queue,campaign-queue,campaign-send-queue,campaign-engagement-queue,billing-queue}

      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVER_URL}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}

      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}

      # Google-only (auth + mail/calendar)
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-true}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL}
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-true}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-true}

      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_MICROSOFT_ENABLED: "false"
      MESSAGING_PROVIDER_MICROSOFT_ENABLED: "false"
      CALENDAR_PROVIDER_MICROSOFT_ENABLED: "false"
      IS_IMAP_SMTP_CALDAV_ENABLED: ${IS_IMAP_SMTP_CALDAV_ENABLED:-false}
      IS_BILLING_ENABLED: "false"
      IS_MULTIWORKSPACE_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      IS_ONBOARDING_AI_CHAT_ENABLED: "false"
      IS_COMPANY_ENRICHMENT_ENABLED: ${IS_COMPANY_ENRICHMENT_ENABLED:-false}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    # Cap Redis RAM for small teams; still noeviction for BullMQ correctness
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  db-data:
  server-local-data:
