[build]
builder = "NIXPACKS"
buildCommand = "yarn install --immutable && yarn nx build twenty-server"

[deploy]
# Twenty listens on NODE_PORT (default 3000), Railway healthchecks PORT.
startCommand = "NODE_PORT=${PORT:-3000} node packages/twenty-server/dist/main"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
