[build]
builder = "NIXPACKS"
buildCommand = "yarn install --immutable && yarn nx build twenty-front"

[deploy]
startCommand = "npx serve@latest packages/twenty-front/build -s -l ${PORT:-3001}"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
