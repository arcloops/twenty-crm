name: CD deploy main

# Detached from twentyhq/twenty-infra. Arcloops deploys via Railway (or your
# own pipeline) from this repository — do not dispatch upstream CD.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note (Railway auto-deploys from GitHub separately)'
        required: false
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip twentyhq infra deploy
        run: |
          echo "This repo no longer triggers twentyhq/twenty-infra."
          echo "Deploy Arcloops CRM from Railway (or your CD) after pushing to main."
