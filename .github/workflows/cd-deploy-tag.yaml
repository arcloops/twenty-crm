name: CD deploy tag

# Detached from twentyhq/twenty-infra tag CD. Arcloops releases via Railway.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note'
        required: false
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip twentyhq staging CD
        run: echo "Tag deploys are handled by Arcloops Railway, not twentyhq/twenty-infra."
